plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '5.1.+'
}
version = '0.3.3-port-alpha1'
group = 'fr.community.cosycritters'
archivesBaseName = 'cosycritters-forge-1.18.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.18.2'
    runs {
        client { workingDirectory project.file('run'); mods { cosycritters { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { cosycritters { source sourceSets.main } } }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.18.2-40.3.12' }
jar { manifest { attributes(['Specification-Title':'cosycritters','Specification-Vendor':'Community adaptation', 'Specification-Version':'1', 'Implementation-Title':project.name, 'Implementation-Version':project.jar.archiveVersion, 'Implementation-Vendor':'Community adaptation']) } }
jar.finalizedBy('reobfJar')
